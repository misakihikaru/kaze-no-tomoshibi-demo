<!doctype html>

<body data-ready="false" data-motion="off">
  <div class="scene-stage">

    <div class="space-title"><p>風の灯火</p><h1>小さな休憩室</h1><span>立体の間</span></div>

      <button id="light-action" class="object-button" type="button" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="../icons.svg#light"></use></svg><span>灯りに触れる</span></button>

    <p class="view-hint">そっとドラッグして、見渡せます。</p>
    <p id="fallback-message" class="fallback-message" hidden>この端末では、写真の休憩室をお楽しみください。<a href="../rest-room/">写真の休憩室へ</a></p>

  <footer class="space-footer">

      <button class="quiet-button" id="motion-control" type="button" aria-pressed="false" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="../icons.svg#wind"></use></svg><span>動きを止める</span></button>
      <div class="sound-settings">
        <button id="sound-control" class="quiet-button" type="button" aria-expanded="false" aria-controls="sound-panel" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4m13-1q4 3 0 6"/></svg><span>音</span><small id="sound-state">無音</small></button>
